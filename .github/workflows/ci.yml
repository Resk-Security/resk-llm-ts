name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: oven-sh/setup-bun@v2
      - uses: actions/checkout@v4
      - run: bun install
      - run: bun run lint
      - run: bun run test
      - name: Dependency audit
        run: npm audit --audit-level=high
